<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depletion Forecasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE: a finance team's working tool during a forecast cycle. Calm, exact, decisions first.
   IDEA: the cycle board on a planning room wall: fifty markets moving from Agent Draft to CFO Approved.
   PICTURE: the four-step pipeline with live counts, then the market list ranked by where people disagree.
   COLOUR and TYPE: white, ink, green for the agent (as in the pitch), slate for comparisons, red only for gaps and unsaved. Source Serif 4 titles, Inter figures.
   LAYOUT: top bar with role, pipeline and national figures, then the view: Cycle, Market, FP&A review, CFO approval. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#10191e);--ink:light-dark(#121212,#e9eef1);--mut:light-dark(#5b6670,#9fb0bb);--line:light-dark(#dde3e8,#2a3a44);--panel:light-dark(#f2f5f7,#172630);--slate:light-dark(#2e6f8e,#7fb7d1);--green:light-dark(#1f9d4c,#4cc47a);--greens:light-dark(#e8f6ee,#163323);--red:light-dark(#c62a1f,#ff6a5c);--reds:light-dark(#fdecea,#3b1715);--dirty:light-dark(#fff1c2,#4a3d10);--lock:light-dark(#f3f5f6,#16222a);--sel:light-dark(#cfe3ee,#23465a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(16px,2.5vw,32px) max(3vw,14px);max-width:1440px;margin:0 auto}
a{color:var(--slate)}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.tab{background:var(--red);color:#fff;font:600 12px Inter;padding:3px 8px}
h1{font:600 clamp(26px,3vw,38px)/1.05 "Source Serif 4",Georgia,serif;margin:0}
h2{font:600 24px/1.15 "Source Serif 4",Georgia,serif;margin:0 0 6px}
h3{font-size:16px;margin:0 0 8px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
select,input,textarea,button{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:44px;padding:0 10px}
textarea{padding:10px;width:100%;min-height:72px;resize:vertical}
button{cursor:pointer;font-weight:500;white-space:nowrap}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{background:var(--green);color:#fff;border-color:var(--green)}
button.warn{border-color:var(--red);color:var(--red)}
:focus-visible{outline:3px solid var(--slate);outline-offset:1px}
nav.views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto}
nav.views a{padding:10px 14px;text-decoration:none;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;flex:none}
nav.views a.on{color:var(--ink);border-bottom-color:var(--ink)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.step{background:var(--panel);padding:10px 14px 10px 22px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);cursor:pointer;border:0;text-align:left;min-height:64px;border-radius:0}
.step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:14px}
.step b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}.step span{font-size:13px;color:var(--mut)}
.step.agent{background:var(--greens)}.step.on{outline:2px solid var(--ink);outline-offset:-2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.kpi{border-top:3px solid var(--ink);padding-top:6px}.kpi.ag{border-color:var(--green)}.kpi.ly{border-color:var(--slate)}
.kpi small{display:block;color:var(--mut);font-size:13px}.kpi b{font-size:clamp(22px,2.4vw,30px);font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:13px;color:var(--mut);display:block}
.msg{margin:12px 0 0;padding:10px 12px;border-left:4px solid var(--slate);background:var(--panel);font-size:15px}.msg.err{border-color:var(--red);background:var(--reds)}.msg:empty{display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.list th,.list td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.list th{font-size:13px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--bg)}
.list th:nth-child(-n+4),.list td:nth-child(-n+4){text-align:left}
.list tr.r{cursor:pointer}.list tr.r:hover td{background:var(--panel)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--panel)}
.s10{background:var(--greens);color:var(--green)}.s20{background:light-dark(#e6eef8,#1b2a3d);color:var(--slate)}.s30{background:light-dark(#efe9fb,#2a2240);color:light-dark(#5b3fa8,#b9a6ef)}.s40{background:var(--ink);color:var(--bg)}
.gap{font-weight:600}.gap.hi{color:var(--red)}
.wrap{overflow-x:auto;border:1px solid var(--line)}
.mkt{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.lower{grid-template-columns:1fr}}
.side{display:grid;gap:14px}
.card{border:1px solid var(--line);padding:14px}
.card.agent{border-top:3px solid var(--green);background:var(--greens)}
.card.agent h3{color:var(--green)}
.thread{display:grid;gap:10px;max-height:420px;overflow:auto}
.cm{font-size:14px;border-left:3px solid var(--line);padding:2px 0 2px 10px}.cm.agent{border-color:var(--green)}.cm.status{border-color:var(--slate)}
.cm b{font-size:13px}.cm time{font-size:12px;color:var(--mut);margin-left:6px}
.mhead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin:14px 0 8px}
.mhead .meta{color:var(--mut);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--panel);padding:10px;border-top:3px solid var(--ink)}
.bar .sp{flex:1}.pct{width:84px}#note{width:220px}
.g{font-size:14px;user-select:none}
.g th,.g td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right;white-space:nowrap;height:46px}
.g thead th{font-weight:600;font-size:13px;color:var(--mut);background:var(--bg);position:sticky;top:0}
.g th.it,.g td.it{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1;min-width:150px}
.pn{font-weight:600;display:inline-block;width:72px}.ps{color:var(--mut);font-size:14px}.g td.it.cont .pn{visibility:hidden}
.g td.c{cursor:cell;min-width:54px;position:relative}
.g td.lk{background:var(--lock);color:var(--mut);cursor:default}
.g td.dt{background:var(--dirty)}.g td.cf{box-shadow:inset 0 0 0 2px var(--red)}
.g td.sl{background:var(--sel)}.g td.ac{box-shadow:inset 0 0 0 2px var(--slate)}
.g tr.tot td{font-weight:600;border-top:2px solid var(--ink)}.g td.tc{border-left:2px solid var(--ink);font-weight:600}
.cmp{display:block;font-size:11.5px;color:var(--slate);line-height:1.1}.cmp.hi{font-weight:700}
.g input.ed{position:absolute;inset:2px;width:calc(100% - 4px);min-height:0;height:calc(100% - 4px);text-align:right;padding:0 6px;border:2px solid var(--slate)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut);margin-top:8px}
.sw{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.fig{position:relative;height:170px;margin-top:10px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
details{margin-top:18px}summary{cursor:pointer;font-weight:600;padding:6px 0}
.h th,.h td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px}.h td.n{text-align:right}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line)}
.calls{display:grid;gap:12px}
.call{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);padding:12px}
.call .mk{font-size:22px;font-weight:700}
.call p{margin:2px 0 0;font-size:14px;color:var(--mut)}
@media(max-width:700px){.call{grid-template-columns:1fr}.pipe{grid-template-columns:1fr 1fr}#note{width:100%}}
@media(prefers-reduced-motion:no-preference){.g td.dt{transition:background .25s}}
@media(max-width:700px){table{font-size:13px}.list th:nth-child(2),.list td:nth-child(2),.list th:nth-child(3),.list td:nth-child(3),.list th:nth-child(9),.list td:nth-child(9),.list th:nth-child(10),.list td:nth-child(10){display:none}}
</style></head><body>
<div class="band">
 <div class="top">
  <div class="brand"><span class="tab">Plan in BI</span><h1>Depletion Forecasting</h1></div>
  <div class="who"><span id="conn">Connecting</span><label class="f" style="flex-direction:row;align-items:center;gap:6px">Working as<select id="me" aria-label="Working as"></select></label></div>
 </div>
 <div class="pipe" id="pipe" aria-label="Workflow"></div>
 <nav class="views" id="views"><a href="#cycle">Cycle</a><a href="#review">FP&amp;A review</a><a href="#cfo">CFO approval</a><a href="#market" id="mtab">Market</a></nav>
 <p class="msg" id="msg" role="status"></p>
 <main id="view"><div class="empty">Loading the forecast</div></main>
</div>
<script>
{
const SRV="PlanGrid",FC="Forecast",AG="Agent 2+10",LY="Last year actuals";
const $=id=>document.getElementById(id);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nf=new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const fmt=v=>v==null||v===""?"":nf.format(v);
const pct=(a,b)=>b?((a/b-1)*100):null;
const fp=v=>v==null||!isFinite(v)?"":(v>0?"+":"")+v.toFixed(1)+"%";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K=(i,p)=>i+"|"+p;
const mon=p=>MON[+String(p).slice(4,6)-1]+" "+String(p).slice(2,4);
const PROD={p1:"Bourbon",p2:"Scotch",p3:"Whiskey",p4:"Tequila"};
const SIZE={"50ml":["50 ml",1],"375ml":["375 ml",2],"750ml":["750 ml",3],"1.0L":["1.0 L",4],"1.75L":["1.75 L",5]};
const itemInfo=k=>{const m=String(k).match(/^(p\d+)_(.+)$/);if(m&&PROD[m[1]]&&SIZE[m[2]])return{prod:PROD[m[1]],size:SIZE[m[2]][0],o:m[1]+SIZE[m[2]][1]};return{prod:String(k),size:"",o:String(k)}};
const ST={10:"Agent Draft",20:"Planner Submitted",30:"FP&A Reviewed",40:"CFO Approved"};
const GAP=5; // percent difference between planner and agent that needs a look
const S={mcp:null,opts:null,board:null,me:null,view:"cycle",market:null,grid:null,mk:null,edits:new Map(),undo:[],conflicts:new Map(),act:{r:0,c:0},anc:null,editing:false,busy:false,filter:{status:"",scope:"mine",q:""},cmp:AG};

function say(t,err){const m=$("msg");m.textContent=t||"";m.className="msg"+(err?" err":"")}
function errText(e,write){const c=e&&e.code;
 if(c==="server_not_connected")return"The PlanGrid connector is not added to your Claude account. Add it under Settings, Connectors, then reload.";
 if(c==="cancelled")return write?"Claude asked to allow this and it was declined. Nothing changed.":"Cancelled.";
 if(c==="approval_required")return"Claude needs your permission for this. Click again and allow it.";
 if(c==="not_in_manifest")return"This page is not allowed to use PlanGrid for you. Allow it in Claude and reload.";
 if(c==="server_unavailable"||c==="upstream_error")return write?"No reply from PlanGrid. It may have gone through. Reload before trying again.":"No reply from PlanGrid. The service may be waking up. Try again in a minute.";
 if(c==="tool_error")return"PlanGrid reported an error: "+String(e.message||"").slice(0,300);
 return"Something failed ("+(c||"unknown")+")"}
async function call(tool,input){const r=await S.mcp.callTool(SRV,tool,input,{cache:false});let p=r.payload;if(p&&typeof p==="object"&&"result" in p&&Object.keys(p).length===1)p=p.result;return p}
const meU=()=>S.opts&&S.opts.users.find(u=>u.user_id===S.me);
const mine=m=>{const u=meU();return u&&(u.markets==="ALL"||u.markets.split(",").includes(m))};
const role=()=>(meU()||{}).role||"";

/* ---------- top: pipeline and national figures ---------- */
function renderTop(){const b=S.board;if(!b)return;const n={10:0,20:0,30:0,40:0};for(const m of b.markets)n[m.status||10]++;
 const who={10:"Agent drafted, planner to review",20:"Waiting for FP&A",30:"Waiting for the CFO",40:"Plan of record"};
 $("pipe").innerHTML=[10,20,30,40].map(s=>`<button class="step${s===10?" agent":""}${S.filter.status==s&&S.view==="cycle"?" on":""}" data-s="${s}"><b>${n[s]}</b><span>${ST[s]}. ${who[s]}</span></button>`).join("");
 for(const a of document.querySelectorAll("nav.views a"))a.classList.toggle("on",a.getAttribute("href")==="#"+S.view||(S.view==="market"&&a.id==="mtab"));
 $("mtab").textContent=S.market?"Market: "+S.market:"Market";}
$("pipe").onclick=e=>{const b=e.target.closest("button.step");if(!b)return;S.filter.status=S.filter.status===b.dataset.s?"":b.dataset.s;S.filter.scope="all";location.hash="cycle";route()};
function kpis(rows){const t=k=>rows.reduce((a,m)=>a+(m[k]||0),0);const fc=t("forecast"),ag=t("compare"),ly=t("lastYear");
 return`<div class="kpis"><div class="kpi"><small>Planners' forecast ${S.opts.planYear}</small><b>${fmt(fc)}</b><em>${fp(pct(fc,ly))} on ${S.opts.planYear-1}</em></div>
 <div class="kpi ag"><small>Agent draft</small><b>${fmt(ag)}</b><em>${fp(pct(ag,ly))} on ${S.opts.planYear-1}</em></div>
 <div class="kpi"><small>Planners vs agent</small><b>${fp(pct(fc,ag))}</b><em>${fmt(fc-ag)} cases</em></div>
 <div class="kpi ly"><small>${S.opts.planYear-1} actuals</small><b>${fmt(ly)}</b><em>9-litre cases</em></div></div>`}

/* ---------- cycle view ---------- */
function rowsFor(){let r=S.board.markets.map(m=>({...m,gap:pct(m.forecast,m.compare)}));
 if(S.filter.scope==="mine")r=r.filter(m=>mine(m.market));
 if(S.filter.status)r=r.filter(m=>String(m.status||10)===String(S.filter.status));
 if(S.filter.q){const q=S.filter.q.toLowerCase();r=r.filter(m=>[m.market,m.region,m.regional_manager,m.business_unit].some(x=>String(x||"").toLowerCase().includes(q)))}
 return r}
function marketTable(rows,cols){if(!rows.length)return`<div class="empty">No markets match.</div>`;
 return`<div class="wrap"><table class="list"><thead><tr><th>Market</th><th>Region</th><th>Planner</th><th>Status</th><th>Forecast</th><th>Agent</th><th>Planners vs agent</th><th>vs ${S.opts.planYear-1}</th><th>Jan-Feb actual</th><th>Latest note</th></tr></thead><tbody>${
 rows.map(m=>`<tr class="r" data-m="${esc(m.market)}"><td><b>${esc(m.market)}</b></td><td>${esc(m.region||"")}</td><td>${esc(m.regional_manager||"")}</td><td><span class="chip s${m.status||10}">${esc(ST[m.status||10])}</span></td><td>${fmt(m.forecast)}</td><td>${fmt(m.compare)}</td><td class="gap${Math.abs(m.gap||0)>GAP?" hi":""}">${fp(m.gap)}</td><td>${fp(pct(m.forecast,m.lastYear))}</td><td>${fmt(m.ytdActual)}</td><td style="text-align:left;white-space:normal;max-width:280px;font-size:13px;color:var(--mut)">${m.lastNote?esc(m.lastNote.author+": "+m.lastNote.text.slice(0,90)):""}</td></tr>`).join("")}</tbody></table></div>`}
function viewCycle(){const r=rowsFor();
 $("view").innerHTML=kpis(S.board.markets)+`<div class="filters"><label class="f">Show<select id="scope"><option value="mine">My markets</option><option value="all">All markets</option></select></label>
 <label class="f">Status<select id="fst"><option value="">Any</option>${[10,20,30,40].map(s=>`<option value="${s}">${ST[s]}</option>`).join("")}</select></label>
 <label class="f">Find<input id="q" placeholder="Market, region or planner" value="${esc(S.filter.q)}"></label></div>
 <p class="hint">Sorted by the gap between the planners' forecast and the agent's draft. Gaps over ${GAP}% are red. Click a market to open it.</p>`+marketTable(r.sort((a,b)=>Math.abs(b.gap||0)-Math.abs(a.gap||0)));
 $("scope").value=S.filter.scope;$("fst").value=S.filter.status;
 $("scope").onchange=e=>{S.filter.scope=e.target.value;viewCycle();renderTop()};$("fst").onchange=e=>{S.filter.status=e.target.value;viewCycle();renderTop()};
 $("q").oninput=e=>{S.filter.q=e.target.value;const t=$("view").querySelector(".wrap,.empty");const r2=rowsFor().sort((a,b)=>Math.abs(b.gap||0)-Math.abs(a.gap||0));t.outerHTML=marketTable(r2)}}
$("view").addEventListener("click",e=>{const tr=e.target.closest("tr.r,[data-open]");if(tr){location.hash="market-"+(tr.dataset.m||tr.dataset.open).toLowerCase()}});

/* ---------- FP&A review ---------- */
function viewReview(){const all=S.board.markets.map(m=>({...m,gap:pct(m.forecast,m.compare)}));
 const sub=all.filter(m=>m.status===20).sort((a,b)=>Math.abs(b.gap||0)-Math.abs(a.gap||0));
 const look=sub.filter(m=>Math.abs(m.gap||0)>GAP),ok=sub.filter(m=>Math.abs(m.gap||0)<=GAP);
 const can=["FP&A","Admin"].includes(role());
 $("view").innerHTML=`<h2 style="margin-top:16px">FP&amp;A review</h2><p class="hint" style="margin-top:0">${sub.length} markets submitted. ${look.length} differ from the agent by more than ${GAP}% and need a look. ${ok.length} are within ${GAP}% and can be reviewed together.${can?"":" Switch to an FP&A user to act."}</p>
 <h3 style="margin-top:14px">Needs a look</h3>${look.length?`<div class="calls">${look.map(m=>callCard(m,"review")).join("")}</div>`:`<div class="empty">Nothing over ${GAP}% waiting.</div>`}
 <h3 style="margin-top:18px">Within ${GAP}% of the agent</h3>${ok.length?`${can?`<button class="go" id="bulk">Mark all ${ok.length} reviewed</button>`:""}${marketTable(ok)}`:`<div class="empty">None waiting.</div>`}`;
 const bk=$("bulk");if(bk)bk.onclick=()=>bulk(ok.map(m=>m.market),"review")}
function callCard(m,act){const can=act==="review"?["FP&A","Admin"].includes(role()):["CFO","Admin"].includes(role());
 return`<div class="call"><div class="mk">${esc(m.market)}</div><div><b>Planners ${fmt(m.forecast)}</b> vs agent ${fmt(m.compare)} <span class="gap hi">${fp(m.gap)}</span>, ${fp(pct(m.forecast,m.lastYear))} on ${S.opts.planYear-1}<p>${esc(m.regional_manager||"")}${m.lastNote?" · "+esc(m.lastNote.text.slice(0,160)):""}</p></div>
 <div class="acts"><button data-open="${esc(m.market)}">Open</button>${can?`<button class="go" data-act="${act}" data-mk="${esc(m.market)}">${act==="review"?"Mark reviewed":"Approve"}</button><button class="warn" data-act="send_back" data-mk="${esc(m.market)}">Send back</button>`:""}</div></div>`}
$("view").addEventListener("click",async e=>{const b=e.target.closest("button[data-act]");if(!b)return;e.stopPropagation();const act=b.dataset.act,mk=b.dataset.mk;
 let note="";if(act==="send_back"){note=await ask(`Send ${mk} back to the planner`,"What needs to change?");if(note==null)return}
 await doStatus(mk,act,note)});

/* ---------- CFO approval ---------- */
function viewCfo(){const all=S.board.markets.map(m=>({...m,gap:pct(m.forecast,m.compare)}));
 const rev=all.filter(m=>m.status===30).sort((a,b)=>Math.abs(b.forecast-b.compare)-Math.abs(a.forecast-a.compare));
 const big=rev.filter(m=>Math.abs(m.gap||0)>GAP),appr=all.filter(m=>m.status===40);const can=["CFO","Admin"].includes(role());
 const t=(r,k)=>r.reduce((a,m)=>a+(m[k]||0),0);
 $("view").innerHTML=`<h2 style="margin-top:16px">CFO approval</h2>${kpis(all)}
 <p class="hint" style="margin-top:0">${rev.length} markets reviewed by FP&amp;A and waiting for approval, ${fmt(t(rev,"forecast"))} cases. ${appr.length} approved so far, ${fmt(t(appr,"forecast"))} cases.${can?"":" Switch to the CFO to act."}</p>
 <h3 style="margin-top:14px">Calls to make: planners and agent disagree by more than ${GAP}%</h3>${big.length?`<div class="calls">${big.map(m=>callCard(m,"approve")).join("")}</div>`:`<div class="empty">No reviewed market differs from the agent by more than ${GAP}%.</div>`}

 if(!S.board)return;if(S.view==="review")viewReview();else if(S.view==="cfo")viewCfo();else viewCycle()}
function confirmLeave(){say("You have unsaved changes in "+S.market+". Save or discard them before leaving the market.",true);history.replaceState(null,"","#market-"+S.market.toLowerCase());return false}
addEventListener("hashchange",route);
addEventListener("beforeunload",e=>{if(S.edits.size){e.preventDefault();e.returnValue=""}});
async function loadBoard(){S.board=await call("get_board",{scenario:FC,compare:AG});renderTop()}
$("me").onchange=e=>{S.me=+e.target.value;try{localStorage.setItem("pg.me",S.me)}catch(_){}S.filter.scope=role()==="Planner"?"mine":"all";say(`Working as ${meU().name}, ${meU().role}.`);if(S.view==="market"&&S.market)loadMarket(S.market,true);else route()};
async function boot(){let t=0;while(!window.claude&&t++<30)await new Promise(r=>setTimeout(r,100));
 const m=window.claude?await window.claude.use("mcp").catch(()=>null):null;
 if(!m){$("conn").textContent="Not connected";$("view").innerHTML=`<div class="empty">Open this page in Claude with the PlanGrid connector added.</div>`;return}
 S.mcp=m;
 try{S.opts=await call("list_options",{});await loadBoard()}catch(e){$("conn").textContent="Not connected";$("view").innerHTML=`<div class="empty">${esc(errText(e))}</div>`;return}
 $("conn").innerHTML=`<span style="color:var(--green)">●</span> Live`;
 let saved=null;try{saved=+localStorage.getItem("pg.me")}catch(_){}
 let guess=null;try{const u=await window.claude.use("user");const id=u&&await u.me();if(id){const ps=await u.profiles([id]);const nm=(ps&&ps[id]&&ps[id].name)||"";guess=S.opts.users.find(x=>x.name.toLowerCase()===nm.toLowerCase())}}catch(_){}
 S.me=(S.opts.users.find(u=>u.user_id===saved)||guess||S.opts.users.find(u=>u.role==="Admin")||S.opts.users[0]).user_id;
 const grp=["Planner","FP&A","CFO","Admin"];$("me").innerHTML=grp.map(r=>`<optgroup label="${esc(r)}">${S.opts.users.filter(u=>u.role===r).map(u=>`<option value="${u.user_id}">${esc(u.name)}${r==="Planner"?" ("+esc(u.markets.split(",").length)+" markets)":""}</option>`).join("")}</optgroup>`).join("");
 $("me").value=S.me;S.filter.scope=role()==="Planner"?"mine":"all";route()}
boot();
}
