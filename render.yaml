databases:
  - name: plangrid-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
services:
  - type: web
    name: plangrid
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: plangrid-db
          property: connectionString
      - key: PLANGRID_SECRET
        sync: false
      - key: PLANGRID_LOCKED
        value: "Actuals,Agent 2+10"
      - key: PLANGRID_LOCK_BEFORE
        value: "20260301"
